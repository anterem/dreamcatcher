[package]
name = "dreamcatcher"
version = "1.1.0"
description = "A companion app for Dreamlight Valley."
authors = ["anterem"]
edition = "2024"
license = "GPL-3.0-only"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "dreamcatcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aes = "0.9.1"
cipher = { version = "0.5.2", features = ["block-padding"] }
ecb = { version = "0.2.0", features = ["alloc"] }
hex-literal = "1.1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { version = "2.0.0-rc.25", features = ["derive", "serde_json"] }
specta-typescript = "0.0.12"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-specta = { version = "2.0.0-rc.25", features = ["derive", "typescript"] }
thiserror = "2.0.18"
zip = "8.6.0"
chrono = "0.4"
notify-debouncer-full = "0.7.0"

[target.'cfg(windows)'.dependencies]
known-folders = "1.4.2"
winreg = "0.56.0"
